<div class="form-container">
  <h2>Create Customer Account</h2>
  <div class="form-group">
    <label>First Name:</label>
    <input type="text" [(ngModel)]="name" placeholder="Enter full name" />
  </div>
  <div class="form-group">
    <label>Surname:</label>
    <input type="text" [(ngModel)]="surname" placeholder="Enter surname" />
  </div>
  <div class="form-group">
    <label>Mobile No (Optional):</label>
    <input type="text" [(ngModel)]="mobile" placeholder="Enter mobile number" />
  </div>
  <div class="button-group">
    <button class="btn-submit" (click)="onCreate()">Create Account</button>
    <button class="btn-cancel" (click)="onCancel()">Cancel</button>
  </div>
</div>
